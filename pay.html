<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline' https://www.paypal.com https://*.paypal.com; style-src 'unsafe-inline'; connect-src https://iiococmsdechbjjjftkd.supabase.co https://*.paypal.com; frame-src https://*.paypal.com; img-src data: https://*.paypal.com https://*.paypalobjects.com; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#150b2a">
<title>Nocturne · Débloquer la TV</title>
<style>
:root{--bg:#0b0714;--card:#1a1030;--line:#3a2a58;--txt:#f4efff;--mut:#b9a9d4;--acc:#8a4dff;--bad:#ff9aa6;--ok:#86f0b2}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--txt);font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
body{background:radial-gradient(ellipse at 50% -10%,#35196a 0%,#150b2a 55%,#0b0714 100%) no-repeat fixed;padding:max(20px,env(safe-area-inset-top)) 18px max(24px,env(safe-area-inset-bottom))}
main{max-width:460px;margin:0 auto}
.logo{text-align:center;margin:10px 0 18px}
.logo b{display:block;font-size:26px;letter-spacing:8px}
.logo span{display:block;margin-top:6px;color:var(--mut);font-size:15px}
.card{background:rgba(26,16,48,.9);border:1px solid var(--line);border-radius:22px;padding:22px 18px}
h1{font-size:22px;margin:0 0 6px}
p.lead{margin:0 0 18px;color:var(--mut);font-size:15px;line-height:1.45}
label{display:block;margin:0 0 14px}
label span{display:block;margin:0 0 6px;font-size:13px;color:var(--mut)}
input{width:100%;height:52px;padding:0 14px;border:1.5px solid var(--line);border-radius:14px;background:#120a24;color:#fff;font-size:17px;outline:0}
input:focus{border-color:var(--acc);background:#1a0f33}
.go{width:100%;height:56px;margin-top:6px;border:0;border-radius:16px;background:linear-gradient(90deg,#7b3dff,#b04dff);color:#fff;font-size:18px;font-weight:700}
.go:disabled{opacity:.6}
.msg{min-height:22px;margin:10px 2px 0;font-size:15px;color:var(--bad)}
.msg.ok{color:var(--ok)}
.price{font-size:34px;font-weight:800;margin:4px 0 2px}
.note{margin:16px 2px 0;color:#8f7db5;font-size:12.5px;line-height:1.5}
#pay,#done{display:none}
#paypal{margin-top:14px;min-height:60px}
</style>
</head>
<body>
<main>
  <div class="logo"><b>NOCTURNE</b><span id="sub"></span></div>
  <div class="card">
    <div id="login">
      <h1 id="t1"></h1>
      <p class="lead" id="l1"></p>
      <label><span id="lm"></span><input id="mail" type="email" autocomplete="email" autocapitalize="off" spellcheck="false"></label>
      <label><span id="lp"></span><input id="pw" type="password" autocomplete="current-password"></label>
      <button class="go" id="go" type="button"></button>
    </div>
    <div id="pay">
      <h1 id="t2"></h1>
      <div class="price" id="price"></div>
      <p class="lead" id="l2"></p>
      <div id="paypal"></div>
    </div>
    <div id="done">
      <h1 id="t3"></h1>
      <p class="lead" id="l3"></p>
    </div>
    <div class="msg" id="msg"></div>
    <p class="note" id="note"></p>
  </div>
</main>
<script>
(function () {
  'use strict';
  var SB = 'https://iiococmsdechbjjjftkd.supabase.co', KEY = 'sb_publishable_fQRmzgArwTO7iFAhxK-m6w_86EpMO1F';
  var fr = /^fr/i.test(navigator.language || 'fr');
  var T = fr ? {
    sub: 'Débloquer Nocturne sur ta TV', t1: 'Connecte-toi', l1: 'Utilise le même compte Nocturne que celui affiché sur ta TV.', lm: 'Adresse e-mail', lp: 'Mot de passe', go: 'Se connecter',
    t2: 'Débloquer à vie', l2: 'Paiement unique, une seule fois pour toujours. Ta TV se débloque toute seule après le paiement.', t3: 'C’est débloqué !', l3: 'Retourne sur ta TV : Nocturne est débloqué à vie pour ce compte.',
    bad: 'E-mail ou mot de passe incorrect.', net: 'Pas de connexion internet.', off: 'Le paiement n’est pas encore activé. Réessaie plus tard.', fail: 'Le paiement n’a pas abouti. Aucun montant n’a été débité si PayPal ne l’a pas confirmé.',
    note: 'Paiement sécurisé par PayPal. Nocturne ne voit jamais tes informations bancaires. Achat numérique à usage personnel.', have: 'Ce compte est déjà débloqué.'
  } : {
    sub: 'Unlock Nocturne on your TV', t1: 'Sign in', l1: 'Use the same Nocturne account as the one shown on your TV.', lm: 'E-mail address', lp: 'Password', go: 'Sign in',
    t2: 'Unlock for life', l2: 'One-time payment, once and for all. Your TV unlocks by itself after payment.', t3: 'Unlocked!', l3: 'Go back to your TV: Nocturne is unlocked for life for this account.',
    bad: 'Incorrect e-mail or password.', net: 'No internet connection.', off: 'Payment is not enabled yet. Try again later.', fail: 'The payment did not go through. Nothing is charged unless PayPal confirms it.',
    note: 'Secure payment by PayPal. Nocturne never sees your card details. Digital purchase for personal use.', have: 'This account is already unlocked.'
  };
  function $(id) { return document.getElementById(id); }
  function set(id, k) { $(id).textContent = T[k]; }
  ['sub', 't1', 'l1', 'lm', 'lp', 'go', 't2', 'l2', 't3', 'l3', 'note'].forEach(function (k) { set(k, k); });
  function msg(t, ok) { $('msg').textContent = t || ''; $('msg').className = ok ? 'msg ok' : 'msg'; }
  var token = '';
  function pass(p) { return String(p).length < 6 ? String(p) + '-nocturne' : String(p); } /* même règle que les applis Nocturne */

  function api(path, body, cb, auth) {
    var x = new XMLHttpRequest();
    x.open('POST', SB + path, true);
    x.setRequestHeader('apikey', KEY); x.setRequestHeader('Content-Type', 'application/json');
    if (auth) x.setRequestHeader('Authorization', 'Bearer ' + auth);
    x.onload = function () { var d = null; try { d = JSON.parse(x.responseText); } catch (e) { d = null; } cb(x.status, d); };
    x.onerror = function () { cb(0, null); };
    x.send(JSON.stringify(body));
  }

  function loadPaypal(cfg) {
    var s = document.createElement('script');
    s.src = 'https://www.paypal.com/sdk/js?client-id=' + encodeURIComponent(cfg.clientId) + '&currency=' + cfg.currency + '&intent=capture';
    s.onload = function () {
      window.paypal.Buttons({
        style: { layout: 'vertical', shape: 'rect', label: 'pay' },
        createOrder: function () {
          return new Promise(function (res, rej) {
            api('/functions/v1/tv-paypal', { action: 'create' }, function (st, d) {
              if (d && d.unlocked) { done(); rej(new Error('unlocked')); return; }
              if (d && d.orderId) res(d.orderId); else rej(new Error('order'));
            }, token);
          });
        },
        onApprove: function (data) {
          msg('…', true);
          api('/functions/v1/tv-paypal', { action: 'capture', orderId: data.orderID }, function (st, d) {
            if (d && d.unlocked) done(); else msg(T.fail);
          }, token);
        },
        onError: function () { msg(T.fail); }
      }).render('#paypal');
    };
    s.onerror = function () { msg(T.net); };
    document.head.appendChild(s);
  }
  function done() { $('pay').style.display = 'none'; $('done').style.display = 'block'; msg(''); }

  function showPay() {
    $('login').style.display = 'none'; $('pay').style.display = 'block'; msg('');
    api('/functions/v1/tv-paypal', { action: 'config' }, function (st, cfg) {
      if (!cfg || !cfg.clientId) { msg(T.off); return; }
      $('price').textContent = Number(cfg.price).toFixed(2).replace('.', fr ? ',' : '.') + ' €';
      api('/rest/v1/rpc/tv_unlocked', {}, function (s2, d) { if (d === true) { $('pay').style.display = 'none'; $('done').style.display = 'block'; $('l3').textContent = T.have; return; } loadPaypal(cfg); }, token);
    });
  }

  $('go').addEventListener('click', function () {
    var mail = $('mail').value.replace(/^\s+|\s+$/g, ''), pw = $('pw').value;
    if (!mail || !pw) { msg(T.bad); return; }
    $('go').disabled = true; msg('…', true);
    api('/auth/v1/token?grant_type=password', { email: mail, password: pass(pw) }, function (st, d) {
      $('go').disabled = false;
      if (st === 0) { msg(T.net); return; }
      if (!d || !d.access_token) { msg(T.bad); return; }
      token = d.access_token; $('pw').value = ''; showPay();
    });
  });
}());
</script>
</body>
</html>
